<style>
  /* Chalk Lab tokens, copied from src/app/globals.css */
  :root {
    --paper: #f7f5ef;
    --paper-warm: #f0ede4;
    --ink: #22211c;
    --ink-soft: #5a574c;
    --ink-faint: #6b675a;
    --line: rgba(34, 33, 28, 0.12);
    --coral: #d96c4f;
    --coral-deep: #ae4527;
    --blue: #4e7dc4;
    --blue-soft: #e4ecf7;
    --green: #619b6e;
    --marigold: #dfa33c;
    --marigold-soft: #f9eeda;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    /* the site's .dotted-band, on the warm ground */
    background-color: var(--paper-warm);
    background-image: radial-gradient(var(--line) 1.1px, transparent 1.1px);
    background-size: 22px 22px;
    font-family: Outfit, system-ui, sans-serif;
    display: flex;
    padding: 28px;
  }
  .sheet {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 2px 14px rgba(64, 54, 32, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 54px 56px 0;
    overflow: hidden;
  }
  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  h1 {
    margin-top: 16px;
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600;
    font-size: 92px;
    line-height: 1.02;
    letter-spacing: -0.025em;
    color: var(--ink);
  }
  .sub {
    margin-top: 18px;
    font-size: 27px;
    line-height: 1.42;
    color: var(--ink-soft);
    text-align: center;
  }
  .free { color: var(--coral-deep); font-weight: 600; }
  .bench {
    margin-top: auto;
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 50px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  .bench svg { display: block; width: 100%; height: 100%; }
  .org {
    width: 100%;
    padding: 16px 0 18px;
    text-align: center;
    font-size: 19px;
    font-weight: 500;
    color: var(--ink-faint);
  }
</style>
</head>
